name: Lint

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check JavaScript
        run: |
          npm --prefix tools/lint ci --ignore-scripts --no-audit --no-fund
          npm --prefix tools/lint run lint
          npm --prefix tools/lint run format:check
      - name: Check C++ and Python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then BASE_SHA=HEAD^; fi
          uvx --from clang-format==23.1.5 git-clang-format --extensions cpp,h --diff "$BASE_SHA" HEAD
          # Python uses file-wide checks.
          uvx ruff@0.17.5 check tools tests
      - name: Check Actions workflows
        env:
          GOBIN: ${{ runner.temp }}/lint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint"
          uvx zizmor==1.32.0 --offline .
