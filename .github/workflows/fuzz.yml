name: Import corpus

on:
  workflow_call:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [avogadro-web-wasm, avogadro-web-wasm-singlethread]
    env:
      WASM_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: release
      - name: Check a bounded corpus of local molecule files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          npm --prefix tests/browser ci --ignore-scripts --no-audit --no-fund
          python3 -m zipfile -e "release/$WASM_PACKAGE.zip" release/site
          flags=()
          if [[ "$WASM_PACKAGE" == avogadro-web-wasm ]]; then flags+=(--threaded); fi
          if [[ "$EVENT_NAME" == schedule ]]; then flags+=(--nightly); fi
          node tests/browser/import-corpus.mjs release/site "${flags[@]}"
