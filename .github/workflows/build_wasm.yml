name: WASM Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  QT_VERSION: '6.11.1'
  EMSCRIPTEN_VERSION: '4.0.7'
  SUPERBUILD_REVISION: b563eb581623e0c3b16fe72ba33033a0441ba4d2
  # Published library revision matching this editor's plugin profile.
  AVOGADROLIBS_REVISION: 61ce6da07f2a125fae2a26180f9c8addad381672
  # ExternalProject's nested builds must use the same limit as the superbuild.
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  build:
    name: WebAssembly Release (${{ matrix.qt_kit }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - qt_kit: wasm_multithread
            package: avogadro-web-wasm
          - qt_kit: wasm_singlethread
            package: avogadro-web-wasm-singlethread
    env:
      QT_WASM_KIT: ${{ matrix.qt_kit }}
      WASM_PACKAGE: ${{ matrix.package }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout pinned superbuild
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timvdm/openchemistry
          ref: ${{ env.SUPERBUILD_REVISION }}
          path: openchemistry
          persist-credentials: false

      # These companion revisions are published in forks pending upstream merge.
      # Keep the superbuild's exact gitlink pins; only override their fetch URLs.
      - name: Checkout pinned companion sources
        working-directory: openchemistry
        run: |
          git submodule init
          git config submodule.avogadrolibs.url https://github.com/timvdm/avogadrolibs.git
          git config submodule.avogadroapp.url https://github.com/timvdm/avogadroapp.git
          git config submodule.avogadro-web.url https://github.com/timvdm/avogadro-web.git
          git submodule update --init --recursive

      - name: Checkout pinned web-profile libraries
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timvdm/avogadrolibs
          ref: ${{ env.AVOGADROLIBS_REVISION }}
          path: openchemistry/avogadrolibs
          persist-credentials: false

      # With no ref override, pull_request builds GitHub's merge revision,
      # just like the native workflows. Do not build the superbuild's web pin.
      - name: Checkout web revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openchemistry/avogadro-web
          persist-credentials: false

      - name: Check editor security rules
        run: python3 openchemistry/avogadro-web/tests/check-page-security.py

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install cmake ninja-build gzip

      # Separate installation roots keep the host and WASM Qt caches distinct.
      - name: Install host Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/qt-host
          # Host tools link QtCore, which needs Qt's matching ICU runtime.
          archives: qtbase icu
          cache: true
          set-env: false

      - name: Verify host Qt tools
        run: |
          qt_host="$RUNNER_TEMP/qt-host/Qt/$QT_VERSION/gcc_64"
          "$qt_host/libexec/uic" --version
          "$qt_host/libexec/moc" --version
          "$qt_host/libexec/rcc" --version

      - name: Install WASM Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: ${{ matrix.qt_kit }}
          dir: ${{ runner.temp }}/qt-wasm
          archives: qtbase
          cache: true
          set-env: false

      - name: Checkout Emscripten SDK installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emscripten-core/emsdk
          ref: ${{ env.EMSCRIPTEN_VERSION }}
          path: emsdk
          persist-credentials: false

      - name: Cache Emscripten SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            emsdk/upstream
            emsdk/node
          key: wasm-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSCRIPTEN_VERSION }}

      - name: Activate toolchain
        run: |
          ./emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
          {
            echo "EM_CACHE=$RUNNER_TEMP/em-cache"
            echo "QT_HOST_PATH=$RUNNER_TEMP/qt-host/Qt/$QT_VERSION/gcc_64"
            echo "QT_WASM_PATH=$RUNNER_TEMP/qt-wasm/Qt/$QT_VERSION/$QT_WASM_KIT"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          # The WASM Qt archive may ship qt-cmake without executable permissions.
          cmake -S openchemistry -B build-wasm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_WASM_PATH/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DAVOGADRO_WEB_EDITOR=ON \
            -DBUILD_AVOGADRO=ON -DUSE_OPENGL=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_PLUGINS=ON \
            -DENABLE_SUBPROCESS=OFF -DUSE_PYTHON=OFF \
            -DUSE_LIBARCHIVE=OFF -DUSE_PLOTTER=OFF \
            -DBUILD_MOLEQUEUE=OFF -DAvogadro_ENABLE_RPC=OFF \
            -DENABLE_TESTING=OFF

      - name: Build
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          cmake --build build-wasm --parallel 2

      - name: Check build profile
        run: python3 openchemistry/avogadro-web/tests/check-build-profile.py build-wasm "$QT_WASM_KIT"

      - name: Stage and verify web package
        run: |
          source "$GITHUB_WORKSPACE/emsdk/emsdk_env.sh"
          cmake --install build-wasm/avogadro-web --prefix "$RUNNER_TEMP/stage-wasm"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          package = Path(os.environ['RUNNER_TEMP']) / 'stage-wasm/share/avogadro-web'
          required = [
              'index.html', 'editor.css', 'editor.js', 'icons/avogadro2.svg',
              'core/avogadro-editor.js', 'qtloader.js',
              'avogadro-web.js', 'avogadro-web.wasm', 'avogadro-web.wasm.gz',
              'README.md', 'docs/self-hosting.md', 'serve-wasm.py',
          ]
          if os.environ['QT_WASM_KIT'] == 'wasm_singlethread':
              required.append('avogadro-offline.html')
          for name in required:
              path = package / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty package file: {name}')
          with (package / 'avogadro-web.wasm').open('rb') as wasm:
              if wasm.read(8) != b'\x00asm\x01\x00\x00\x00':
                  raise SystemExit('Invalid WASM magic or version')
          # Preserve any worker JS/data emitted by the selected Qt runtime.
          runtime = Path('build-wasm/avogadro-web/bin')
          for pattern in ('*.js', '*.wasm', '*.data'):
              for source in runtime.rglob(pattern):
                  relative_path = source.relative_to(runtime)
                  target = package / relative_path
                  if not target.is_file() or target.stat().st_size != source.stat().st_size:
                      raise SystemExit(f'Missing or incomplete runtime asset: {relative_path}')

          def output(*args):
              return subprocess.check_output(args, text=True).strip()

          manifest = {
              'sources': {
                  name: output('git', '-C', f'openchemistry{suffix}', 'rev-parse', 'HEAD')
                  for name, suffix in (
                      ('openchemistry', ''), ('avogadrolibs', '/avogadrolibs'),
                      ('avogadro-web', '/avogadro-web'),
                  )
              },
              'toolchain': {
                  'qt': os.environ['QT_VERSION'],
                  'emscripten': os.environ['EMSCRIPTEN_VERSION'],
                  'emcc': output('emcc', '--version'),
                  'cmake': output('cmake', '--version'),
                  'ninja': output('ninja', '--version'),
              },
              'profile': f"Release, {os.environ['QT_WASM_KIT']}",
              'github_run_id': os.environ['GITHUB_RUN_ID'],
          }
          (package / 'build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(f'Verified web package: {package}')
          PY

      - name: Set up Node for browser tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install browser test dependencies
        working-directory: openchemistry/avogadro-web/tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test staged package in Chromium
        run: |
          package="$RUNNER_TEMP/stage-wasm/share/avogadro-web"
          tests=openchemistry/avogadro-web/tests/browser
          if [[ "$QT_WASM_KIT" == wasm_singlethread ]]; then
            node "$tests/startup-failures.mjs" "$package" --single-threaded
            offline_dir=$(mktemp -d "$RUNNER_TEMP/offline.XXXXXX")
            cp "$package/avogadro-offline.html" "$offline_dir/"
            node "$tests/browser-smoke.mjs" "file://$offline_dir/avogadro-offline.html" "$RUNNER_TEMP/browser-evidence"
            smoke_args=(--single-threaded)
            (cd "$package" && exec python3 -m http.server 8000 --bind 127.0.0.1) &
          else
            node "$tests/startup-failures.mjs" "$package"
            smoke_args=()
            export AVOGADRO_FCHK_FIXTURE="$GITHUB_WORKSPACE/openchemistry/avogadrodata/data/fchk/h2o-restricted.fchk"
            test -s "$AVOGADRO_FCHK_FIXTURE"
            (cd "$package" && exec python3 serve-wasm.py) &
          fi
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --output /dev/null http://127.0.0.1:8000/
          node "$tests/browser-smoke.mjs" http://127.0.0.1:8000/ "$RUNNER_TEMP/browser-evidence-hosted" "${smoke_args[@]}"

      - name: Create downloadable ZIP
        working-directory: ${{ runner.temp }}/stage-wasm/share/avogadro-web
        run: python3 -m zipfile -c "$RUNNER_TEMP/$WASM_PACKAGE.zip" .

      - name: Upload web package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/${{ matrix.package }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Update continuous download
    needs: build
    if: >-
      github.repository == 'OpenChemistry/avogadro-web' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified ZIPs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: avogadro-web-wasm*
          merge-multiple: true
          path: package

      - name: Publish continuous prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A delayed or manually rerun older build must not replace main.
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$BUILD_SHA" ]; then
            echo 'Skipping superseded build.'
            exit 0
          fi
          cat > notes.md <<EOF
          Latest successful WASM build of main: $BUILD_SHA

          Build: $BUILD_URL

          - avogadro-web-wasm.zip includes worker-based calculations. Run python3 serve-wasm.py after extracting it.
          - avogadro-web-wasm-singlethread.zip supports embedding without cross-origin isolation. Extract it and double-click avogadro-offline.html to run it locally.

          These are development builds. Each ZIP contains build-manifest.json
          with the exact source revisions and toolchain versions.
          The continuous tag marks the initial release; consult the manifest
          for the source revision of the current download.
          EOF
          packages=(package/avogadro-web-wasm.zip package/avogadro-web-wasm-singlethread.zip)
          for archive in "${packages[@]}"; do
            test -s "$archive"
          done
          if gh release view continuous > /dev/null 2>&1; then
            gh release upload continuous "${packages[@]}" --clobber
            gh release edit continuous --prerelease --latest=false --notes-file notes.md
          else
            gh release create continuous "${packages[@]}" \
              --target "$BUILD_SHA" --title 'Continuous WASM build' \
              --prerelease --latest=false --notes-file notes.md
          fi

  pages:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.repository == 'OpenChemistry/avogadro-web' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check for a newer build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          # A delayed or manually rerun older build must not replace main.
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$BUILD_SHA" ]; then
            echo 'Skipping superseded build.'
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified ZIP
        if: steps.current.outputs.superseded != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: avogadro-web-wasm
          path: package

      # Cloudflare in front of web.avogadro.cc adds the COOP/COEP headers.
      # Pages cannot serve the precompressed WASM, and the test server is unused.
      - name: Assemble site
        if: steps.current.outputs.superseded != 'true'
        run: |
          python3 -m zipfile -e package/avogadro-web-wasm.zip site
          rm -f site/serve-wasm.py site/avogadro-web.wasm.gz
          touch site/.nojekyll

      - name: Configure Pages
        if: steps.current.outputs.superseded != 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        if: steps.current.outputs.superseded != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.superseded != 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
