name: Browser tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: Playwright (${{ matrix.browser }}, ${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - kit: wasm_multithread
            package: avogadro-web-wasm
          - kit: wasm_singlethread
            package: avogadro-web-wasm-singlethread
        kit: [wasm_singlethread, wasm_multithread]
    env:
      AVOGADRO_WASM_KIT: ${{ matrix.kit }}
      WASM_PACKAGE: ${{ matrix.package }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.kit == 'wasm_multithread'
        with:
          repository: OpenChemistry/avogadrodata
          ref: a9a93358ab88a6b7f2776bff4650cb76fc2bbd91
          sparse-checkout: |
            data/fchk
            data/molden
            data/cube
          path: fixtures
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-hooks-${{ matrix.package }}
          path: ${{ runner.temp }}/test-hooks
      - name: Install pinned Playwright browser
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps "$BROWSER"
      - name: Test release and hook-enabled packages
        working-directory: tests/browser
        run: |
          export AVOGADRO_WASM_RELEASE="$RUNNER_TEMP/release/site"
          export AVOGADRO_WASM_TEST_HOOKS="$RUNNER_TEMP/test-hooks"
          if [[ "$AVOGADRO_WASM_KIT" == wasm_multithread ]]; then
            export AVOGADRO_FCHK_FIXTURE="$GITHUB_WORKSPACE/fixtures/data/fchk/h2o-restricted.fchk"
            test -s "$AVOGADRO_FCHK_FIXTURE"
          fi
          python3 -m zipfile -e "$RUNNER_TEMP/release/$WASM_PACKAGE.zip" "$AVOGADRO_WASM_RELEASE"
          ./node_modules/.bin/playwright test --project "$BROWSER" --output "$RUNNER_TEMP/playwright-results"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ matrix.browser }}-${{ matrix.package }}
          path: ${{ runner.temp }}/playwright-results
          if-no-files-found: ignore
          retention-days: 7
